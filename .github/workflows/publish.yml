name: Publish

# Publishing a GitHub Release publishes to PyPI. Draft the release, check it,
# then hit Publish; a tag alone does nothing, so a stray `git push --tags` cannot
# ship a version by accident.
#
# Rehearse first with the workflow_dispatch below, target=testpypi. PyPI version
# numbers are immutable, so a half-finished upload cannot be redone.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

# The GITHUB_TOKEN defaults to broad write access. Nothing here needs it;
# the publish jobs re-grant id-token: write for Trusted Publishing.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The version lives in three places: the release tag, pyproject.toml and
      # compactref.__version__. PyPI publishes what pyproject says, so a stale
      # tag or dunder ships a package whose metadata contradicts the release.
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          pip install -e .
          tag="${GITHUB_REF_NAME#v}"
          project=$(python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          dunder=$(python -c "import compactref; print(compactref.__version__)")

          if [ "$tag" != "$project" ] || [ "$tag" != "$dunder" ]; then
            echo "::error::Version mismatch — release tag v$tag, pyproject.toml $project, __version__ $dunder."
            echo "PyPI would publish $project, not what the release claims. Fix them so all three agree."
            exit 1
          fi
          echo "Release v$tag matches pyproject.toml and __version__."

      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      # Required for Trusted Publishing; no API token is stored in the repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI versions are immutable too. Without this, rehearsing the
          # same version twice fails on the upload rather than on anything
          # worth learning about.
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
