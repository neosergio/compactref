name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The GITHUB_TOKEN defaults to broad write access. Nothing here needs it;
# the publish jobs re-grant id-token: write for Trusted Publishing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      # The package ships py.typed, which promises downstream users working
      # type hints. Nothing but this step holds us to that promise.
      - run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The library promises the same reference on every machine, and the
        # golden tests are what hold it to that. Running them only on Linux
        # would leave the promise untested on two of the three platforms
        # people actually use — strftime and the default text encoding are
        # exactly where a platform difference would show.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # The full grid is fifteen jobs for a library with no runtime
          # dependencies. Every Python on Linux, and the ends of the range
          # elsewhere: a platform difference would not hide in 3.12.
          - {os: macos-latest, python-version: "3.11"}
          - {os: macos-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.11"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      # Not a dependency check -- it verifies that what IS installed has its
      # requirements satisfied, which the dev extra guarantees anyway. It is
      # here to catch a broken environment, not a declared dependency; the
      # package job proves the wheel declares none.
      - run: pip check

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"
      - run: python -m build
      - run: twine check --strict dist/*

      # The README promises no runtime dependencies. `pip check` does not
      # prove that -- it only verifies that whatever is installed has its
      # own requirements met, and would pass just as happily if this package
      # declared six. Read the built metadata instead: a Requires-Dist line
      # without an `extra ==` marker is a runtime dependency.
      - name: The wheel must declare no runtime dependencies
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import zipfile
          from email.parser import BytesParser

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              name = next(
                  n for n in archive.namelist() if n.endswith("METADATA")
              )
              metadata = BytesParser().parsebytes(archive.read(name))

          runtime = [
              requirement
              for requirement in metadata.get_all("Requires-Dist") or []
              if "extra ==" not in requirement
          ]

          if runtime:
              raise SystemExit(
                  f"::error::{wheel} declares runtime dependencies, and the "
                  f"README promises none: {runtime}"
              )

          print(f"{wheel} declares no runtime dependencies.")
          PY

      # twine validates metadata, not contents: a wheel missing py.typed passes
      # it without a word. So install what was actually built, somewhere with no
      # source tree to fall back on, and hold it to both of its promises.
      - name: Install the wheel and use it
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl mypy

          cd /tmp    # out of the repo, so a stray import cannot find src/
          /tmp/smoke/bin/python -c "
          from compactref import generate_reference

          reference = generate_reference('01J2H8NQPG6B5X8KGN97SX3R5C')
          assert reference, 'the installed wheel produced no reference'
          print(f'the installed wheel produced {reference}')
          "

      # The package ships py.typed, promising downstream users working type
      # hints. If that file misses the wheel, mypy stops analyzing compactref
      # and silently falls back to Any -- and a downstream project with
      # ignore_missing_imports set (most of them) reports "no issues found" on
      # code that misuses this API. Failing to ship one empty file quietly
      # revokes the guarantee, so prove it survived the build: mypy must reject
      # a call the type hints forbid.
      - name: The installed wheel must still type-check its callers
        run: |
          set -euo pipefail
          mkdir -p /tmp/typed && cd /tmp/typed
          printf '%s\n' \
            'from compactref import generate_reference' \
            'generate_reference(["not a valid source"])' > misuse.py

          # --ignore-missing-imports reproduces what a downstream project with
          # that setting sees, and it is the case that actually goes quiet: a
          # missing py.typed then yields "Success: no issues found" rather than
          # a complaint. Without the flag mypy exits non-zero either way -- once
          # for the bad call, once for the module it could not read -- and the
          # check would pass on a wheel it was written to reject.
          #
          # Demand the diagnostic by name. A non-zero exit is not enough.
          output=$(/tmp/smoke/bin/mypy --ignore-missing-imports misuse.py || true)
          echo "$output"

          if ! grep -q "arg-type" <<<"$output"; then
            echo "::error::mypy did not reject a call the type hints forbid."
            echo "py.typed is missing from the wheel, so callers get no type checking at all."
            exit 1
          fi
          echo "mypy rejected the bad call: py.typed shipped."
