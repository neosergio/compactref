[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "compactref"
version = "0.4.0"
description = "Generate compact human-facing references from ULIDs, UUIDs, and other stable identifiers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Sergio Infante" }
]

keywords = [
    "ulid",
    "uuid",
    "reference",
    "identifier",
    "short-id",
    "human-readable",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = []


[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
    "twine>=6",
]


[project.urls]
Homepage = "https://github.com/neosergio/compactref"
Repository = "https://github.com/neosergio/compactref"
Issues = "https://github.com/neosergio/compactref/issues"
Changelog = "https://github.com/neosergio/compactref/blob/main/CHANGELOG.md"


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
compactref = ["py.typed"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "-q",
]
# The package has no runtime dependencies, so every warning raised during a
# test run comes from this code or from the standard library deprecating
# something out from under it. Either way it is worth a failing build rather
# than a line nobody reads.
filterwarnings = ["error"]


[tool.ruff]
line-length = 79
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]


[tool.ruff.lint.isort]
# The codebase separates the import block with two blank lines.
lines-after-imports = 2


[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
